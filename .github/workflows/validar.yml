name: Validar exercicios

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Instalar dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check scripts tests

      - name: Testes
        run: python -m pytest -q

  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Validar Python
        run: python -m compileall -q linguagens/python scripts

      - name: Configurar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"

          while IFS= read -r dir; do
            echo "::group::javac $dir"
            javac -d "$RUNNER_TEMP/classes" "$dir"/*.java
            echo "::endgroup::"
          done < <(find linguagens/java -name '*.java' -printf '%h\n' | sort -u)

      - name: Validar C
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r arquivo; do
            echo "::group::gcc $arquivo"
            gcc -fsyntax-only "$arquivo"
            echo "::endgroup::"
          done < <(find linguagens/c -name '*.c' | sort)

      - name: Validar Assembly
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r arquivo; do
            echo "::group::as $arquivo"
            as -o "$RUNNER_TEMP/$(basename "$arquivo").o" "$arquivo"
            echo "::endgroup::"
          done < <(find linguagens/assembly -name '*.asm' | sort)
