name: Validar exercicios

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check scripts tests

      - name: Testes
        run: python -m pytest -q

  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validar Python
        run: python -m compileall -q linguagens/python scripts

      - name: Configurar Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"

          while IFS= read -r dir; do
            echo "::group::javac $dir"
            javac -d "$RUNNER_TEMP/classes" "$dir"/*.java
            echo "::endgroup::"
          done < <(find linguagens/java -name '*.java' -printf '%h\n' | sort -u)

      - name: Validar C
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r arquivo; do
            echo "::group::gcc $arquivo"
            gcc -fsyntax-only "$arquivo"
            echo "::endgroup::"
          done < <(find linguagens/c -name '*.c' | sort)

      - name: Validar Assembly
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r arquivo; do
            echo "::group::as $arquivo"
            as -o "$RUNNER_TEMP/$(basename "$arquivo").o" "$arquivo"
            echo "::endgroup::"
          done < <(find linguagens/assembly -name '*.asm' | sort)
