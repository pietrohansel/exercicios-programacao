
name: Organizar exercicios

on:
  push:
    paths:
      - "entrada/**"
      - "scripts/organizar.py"
      - ".github/workflows/organizar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizar-exercicios
  cancel-in-progress: false

jobs:
  organizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Organizar exercicios
        shell: bash
        run: |
          set -euo pipefail
          python scripts/organizar.py | tee "$RUNNER_TEMP/organizar.log"

      - name: Registrar alteracoes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para registrar."
            exit 0
          fi

          resumo=$(grep ' -> ' "$RUNNER_TEMP/organizar.log" | sed 's/^/- /' || true)

          if [ -n "$resumo" ]; then
            git commit -m "chore: organiza novos exercicios" -m "$resumo"
          else
            git commit -m "chore: organiza novos exercicios"
          fi

          git push
