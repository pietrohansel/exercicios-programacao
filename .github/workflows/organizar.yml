name: Organizar exercicios

on:
  push:
    paths:
      - "entrada/**"
      - "scripts/organizar.py"
      - "scripts/indice.py"
      - ".github/workflows/organizar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizar-exercicios
  cancel-in-progress: false

jobs:
  organizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Organizar exercicios
        shell: bash
        run: |
          set -euo pipefail
          python scripts/organizar.py | tee "$RUNNER_TEMP/organizar.log"
          python scripts/indice.py

      - name: Registrar alteracoes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- entrada linguagens

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para registrar."
            exit 0
          fi

          resumo=$(grep ' -> ' "$RUNNER_TEMP/organizar.log" | sed 's/^/- /' || true)

          if [ -n "$resumo" ]; then
            git commit -m "chore: organiza novos exercicios" -m "$resumo"
          else
            git commit -m "chore: organiza novos exercicios"
          fi

          git push
