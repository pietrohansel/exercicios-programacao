
name: Organizar exercicios

on:
  push:
    paths:
      - "entrada/**"
      - "scripts/organizar.py"
      - ".github/workflows/organizar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizar-exercicios
  cancel-in-progress: false

jobs:
  organizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Organizar exercicios
        run: python scripts/organizar.py

      - name: Registrar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para registrar."
          else
            git commit -m "Organiza novos exercicios automaticamente"
            git push
          fi
